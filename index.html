<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WorldForge</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app">
<aside class="panel">
  <div class="brand"><b>WORLDFORGE</b><span id="version">v—</span></div><p class="sub">Deterministic procedural world asset lab</p>
  <div class="tabs tabs6"><button class="tab active" data-mode="building">BUILDING</button><button class="tab" data-mode="prop">PROPS</button><button class="tab" data-mode="surface">SURFACE</button><button class="tab" data-mode="field">FIELD</button><button class="tab" data-mode="terrain">TERRAIN</button><button class="tab" data-mode="landscape">LANDSCAPE</button></div>
  <label>Seed<div class="seedrow"><input id="seed" type="number" value="48127"><button id="randomize">↻</button></div></label>
  <section id="buildingPanel">
    <label>Building engine<select id="buildingEngine"><option value="1.3.0" selected>1.3 — RPG Architecture II</option><option value="1.2.0">1.2 — RPG Architecture I</option><option value="1.1.0">1.1 — Variety Engine</option><option value="1.0.0">1.0 — Protected Legacy</option></select></label>
    <div class="cols"><label>Family<select id="family"><optgroup label="Core"><option value="cottage">Cottage</option><option value="house">House</option><option value="shop" selected>Shop</option><option value="inn">Inn</option><option value="shack">Shack</option><option value="barn">Barn</option><option value="warehouse">Warehouse</option></optgroup><optgroup label="RPG Village"><option class="rpgFamily" value="peasantHouse">Peasant House</option><option class="rpgFamily" value="farmhouse">Farmhouse</option><option class="rpgFamily" value="smithy">Blacksmith / Smithy</option><option class="rpgFamily" value="chapel">Chapel / Shrine</option><option class="rpgFamily" value="stable">Stable</option><option class="rpgFamily" value="guildHall">Guild Hall</option><option class="rpgFamily" value="merchantHouse">Merchant House</option></optgroup><optgroup label="Castle / Fort"><option class="rpgFamily" value="watchtower">Watchtower</option><option class="rpgFamily" value="gatehouse">Gatehouse</option><option class="rpgFamily" value="keep">Castle Keep</option><option class="rpgFamily" value="castleWall">Castle Wall</option><option class="rpgFamily" value="barracks">Barracks</option></optgroup><optgroup label="RPG World II"><option class="rpg2Family" value="watermill">Watermill</option><option class="rpg2Family" value="windmill">Windmill</option><option class="rpg2Family" value="dock">Dock / Pier</option><option class="rpg2Family" value="dockWarehouse">Dock Warehouse</option><option class="rpg2Family" value="temple">Temple</option><option class="rpg2Family" value="mageTower">Mage Tower</option><option class="rpg2Family" value="ruinedFort">Ruined Fort</option><option class="rpg2Family" value="desertHouse">Desert House</option><option class="rpg2Family" value="desertMarket">Desert Market</option><option class="rpg2Family" value="mineEntrance">Mine Entrance</option><option class="rpg2Family" value="cityGate">Grand City Gate</option><option class="rpg2Family" value="sewerEntrance">Sewer Entrance</option><option class="rpg2Family" value="townHall">Town Hall / Civic Hall</option></optgroup></select></label><label>Condition<select id="condition"><option value="clean">Clean</option><option value="worn">Worn</option><option value="abandoned">Abandoned</option></select></label></div>
    <label>Style<select id="style"><optgroup label="Core"><option value="smallWoodTown">Small Wood Town</option><option value="mountain">Mountain Timber</option><option value="stoneTown">Stone Town</option><option value="industrial">Industrial</option><option value="abandonedEdge">Abandoned Edge</option></optgroup><optgroup label="RPG Styles"><option class="rpgStyle" value="oldRpgVillage">Old RPG Village</option><option class="rpgStyle" value="rusticVillage">Rustic Village</option><option class="rpgStyle" value="frontierTown">Frontier Town</option><option class="rpgStyle" value="fortifiedStone">Fortified Stone</option><option class="rpgStyle" value="castleKeep">Castle Keep</option><option class="rpgStyle" value="monastery">Monastery / Shrine</option></optgroup><optgroup label="RPG World II"><option class="rpg2Style" value="riverVillage">River Village</option><option class="rpg2Style" value="harborTown">Harbor Town</option><option class="rpg2Style" value="highTemple">High Temple</option><option class="rpg2Style" value="arcane">Arcane</option><option class="rpg2Style" value="ancientRuins">Ancient Ruins</option><option class="rpg2Style" value="desertTown">Desert Town</option><option class="rpg2Style" value="miningTown">Mining Town</option><option class="rpg2Style" value="grandCity">Grand City</option><option class="rpg2Style" value="sewerworks">Sewerworks</option></optgroup></select></label>
    <label>Material<select id="material"><option value="auto">Auto by style</option><option value="wood">Wood</option><option value="timberPlaster">Timber + Plaster</option><option value="stone">Stone</option><option value="brick">Brick</option><option value="metal">Metal</option></select></label>
    <div class="cols modernBuilding"><label>Structure<select id="template"><optgroup label="Core"><option value="auto">Auto by family</option><option value="compact">Compact</option><option value="wideFront">Wide Front</option><option value="lWing">L-Wing</option><option value="sideWing">Side Wing</option><option value="twinWing">Twin Wing</option><option value="stepped">Stepped Massing</option><option value="tallNarrow">Tower Bay</option><option value="shopfront">Shopfront</option><option value="workshop">Workshop Bay</option><option value="courtyardFront">Courtyard Front</option></optgroup><optgroup label="RPG"><option class="rpgTemplate" value="hearthHouse">Hearth House</option><option class="rpgTemplate" value="longhouse">Longhouse</option><option class="rpgTemplate" value="smithyYard">Smithy Yard</option><option class="rpgTemplate" value="chapelNave">Chapel Nave</option><option class="rpgTemplate" value="guildHall">Guild Hall</option><option class="rpgTemplate" value="squareTower">Square Tower</option><option class="rpgTemplate" value="roundTower">Round Tower</option><option class="rpgTemplate" value="twinSquareGate">Twin Square Gate</option><option class="rpgTemplate" value="twinRoundGate">Twin Round Gate</option><option class="rpgTemplate" value="keepBlock">Keep Block</option><option class="rpgTemplate" value="wallSegment">Wall Segment</option><option class="rpgTemplate" value="barracksHall">Barracks Hall</option></optgroup><optgroup label="RPG World II"><option class="rpg2Template" value="waterMillHouse">Watermill House</option><option class="rpg2Template" value="windmillTower">Windmill Tower</option><option class="rpg2Template" value="dockPier">Dock Pier</option><option class="rpg2Template" value="dockWarehouse">Dock Warehouse</option><option class="rpg2Template" value="templeHall">Temple Hall</option><option class="rpg2Template" value="mageSpire">Mage Spire</option><option class="rpg2Template" value="ruinedFort">Ruined Fort</option><option class="rpg2Template" value="adobeCourtyard">Adobe Courtyard</option><option class="rpg2Template" value="desertBazaar">Desert Bazaar</option><option class="rpg2Template" value="minePortal">Mine Portal</option><option class="rpg2Template" value="grandCityGate">Grand City Gate</option><option class="rpg2Template" value="sewerPortal">Sewer Portal</option><option class="rpg2Template" value="civicHall">Civic Hall</option></optgroup></select></label><label>Facade<select id="facade"><option value="auto">Auto</option><option value="symmetric">Symmetric</option><option value="asymmetric">Asymmetric</option><option value="storefront">Storefront</option><option value="rural">Rural Braced</option><option value="workshop">Workshop</option></select></label></div>
    <div class="cols modernBuilding"><label>Wealth<select id="wealth"><option value="poor">Poor</option><option value="modest" selected>Modest</option><option value="prosperous">Prosperous</option></select></label><label>Age<select id="age"><option value="new">New</option><option value="mature" selected>Mature</option><option value="old">Old</option></select></label></div>
    <label class="modernBuilding">Construction<select id="construction"><option value="auto">Auto mixed materials</option><option value="uniform">Uniform material</option><option value="stoneBase">Stone base course</option><option value="brickBase">Brick base course</option></select></label>
    <label>Width <input id="width" type="range" min="3.25" max="14" step="0.25" value="6.5"><output id="widthOut"></output></label>
    <label>Depth <input id="depth" type="range" min="2.75" max="11" step="0.25" value="4.75"><output id="depthOut"></output></label>
    <label>Floors <input id="floors" type="range" min="1" max="4" step="1" value="2"><output id="floorsOut"></output></label>
    <div class="cols"><label>Roof<select id="roof"><option value="gable">Gable</option><option value="hip">Hip</option><option value="flat">Flat</option><option class="modernRoof" value="crossGable">Cross Gable</option><option class="modernRoof" value="shed">Shed</option><option class="modernRoof" value="gambrel">Gambrel</option><option class="rpgRoof" value="conical">Conical / Tower</option><option class="rpgRoof" value="parapet">Parapet / Battlement</option><option class="rpg2Roof" value="dome">Dome</option><option class="rpg2Roof" value="spire">Spire</option></select></label><label>Roof pitch <input id="pitch" type="range" min="15" max="65" step="1" value="42"><output id="pitchOut"></output></label></div>
    <div class="checks"><label><input id="chimney" type="checkbox" checked> Chimney</label><label><input id="porch" type="checkbox" checked> Porch</label><label><input id="sign" type="checkbox" checked> Sign</label><label><input id="extension" type="checkbox" checked> Side extension</label></div>
  </section>
  <section id="propPanel" hidden>
    <div class="cols"><label>Prop family<select id="propFamily"><option value="well">Well</option><option value="fence">Fence</option><option value="signpost">Signpost</option><option value="supplies">Crates + Barrels</option></select></label><label>Condition<select id="propCondition"><option value="clean">Clean</option><option value="worn">Worn</option><option value="abandoned">Abandoned</option></select></label></div>
    <div class="cols"><label>Style<select id="propStyle"><option value="village">Village</option><option value="mountain">Mountain</option><option value="stone">Stone</option><option value="rough">Rough</option></select></label><label>Variant<select id="propVariant"><option value="auto">Auto</option><option value="stone">Stone</option><option value="wood">Wood</option><option value="roofed">Roofed</option><option value="straight">Straight</option><option value="corner">Corner</option><option value="gate">Gate</option><option value="broken">Broken</option><option value="single">Single</option><option value="cluster">Cluster</option></select></label></div>
    <label>Scale <input id="propScale" type="range" min="0.5" max="2.5" step="0.05" value="1"><output id="propScaleOut"></output></label>
  </section>
  <section id="terrainPanel" hidden>
    <label>Patch<select id="terrainPatch"><option value="grass">Grass Field</option><option value="dirt">Dirt Ground</option><option value="path">Grass + Path</option><option value="wornVillage">Worn Village Ground</option></select></label>
    <label>Size <input id="patchSize" type="range" min="6" max="40" step="1" value="12"><output id="patchSizeOut"></output></label>
    <label>Surface roughness <input id="patchRoughness" type="range" min="0" max="1" step="0.05" value="0.18"><output id="patchRoughnessOut"></output></label>
    <label>Path width <input id="pathWidth" type="range" min="0.8" max="6" step="0.1" value="2.2"><output id="pathWidthOut"></output></label>
    <label>Wear <input id="wear" type="range" min="0" max="1" step="0.05" value="0.35"><output id="wearOut"></output></label>
    <label>Mesh resolution <input id="patchResolution" type="range" min="12" max="72" step="4" value="32"><output id="patchResolutionOut"></output></label>
  </section>
  <section id="surfacePanel" hidden>
    <div class="cols"><label>Surface<select id="surfaceType"><option value="grass">Grass</option><option value="dirt">Dirt</option><option value="wornVillage">Worn Village</option><option value="stone">Stone</option><option value="cobblestone">Cobblestone</option><option value="mud">Mud</option><option value="sand">Sand</option><option value="rocky">Rocky</option></select></label><label>Path pattern<select id="surfacePathPattern"><option value="none">None</option><option value="straight">Straight</option><option value="curve">Curved</option><option value="tee">T Junction</option><option value="cross">Crossroads</option><option value="plaza">Plaza</option></select></label></div>
    <div class="cols"><label>Path material<select id="surfacePathMaterial"><option value="dirt">Dirt</option><option value="stone">Stone</option><option value="cobblestone">Cobblestone</option><option value="sand">Sand</option></select></label><label><span class="checkline"><input id="surfaceEdgeBlend" type="checkbox" checked> Blend edges</span></label></div>
    <label>Size <input id="surfaceSize" type="range" min="8" max="64" step="1" value="24"><output id="surfaceSizeOut"></output></label>
    <label>Variation <input id="surfaceVariation" type="range" min="0" max="1" step="0.05" value="0.55"><output id="surfaceVariationOut"></output></label>
    <label>Wear <input id="surfaceWear" type="range" min="0" max="1" step="0.05" value="0.22"><output id="surfaceWearOut"></output></label>
    <label>Path width <input id="surfacePathWidth" type="range" min="0.8" max="8" step="0.1" value="2.4"><output id="surfacePathWidthOut"></output></label>
    <label>Detail density <input id="surfaceDetailDensity" type="range" min="0" max="1" step="0.05" value="0.42"><output id="surfaceDetailDensityOut"></output></label>
    <label>Mesh resolution <input id="surfaceResolution" type="range" min="16" max="96" step="4" value="40"><output id="surfaceResolutionOut"></output></label>
  </section>
  <section id="fieldPanel" hidden>
    <label>Field preset<select id="fieldPreset"><option value="villageWellSquare">Village Well Square</option><option value="ruralHouseLane">Rural House Lane</option><option value="marketCorner">Market Corner</option><option value="castleCourtyard">Castle Courtyard</option><option value="castleGateApproach">Castle Gate Approach</option><option value="mountainPath">Mountain Path</option><option value="mineEntranceClearing">Mine Entrance Clearing</option><option value="desertMarket">Desert Market</option><option value="docksideLane">Dockside Lane</option></select></label>
    <div class="cols"><label>Surface override<select id="fieldSurface"><option value="auto">Auto by preset</option><option value="grass">Grass</option><option value="dirt">Dirt</option><option value="wornVillage">Worn Village</option><option value="stone">Stone</option><option value="cobblestone">Cobblestone</option><option value="mud">Mud</option><option value="sand">Sand</option><option value="rocky">Rocky</option></select></label><label>Building engine<select id="fieldBuildingEngine"><option value="1.3.0" selected>1.3 — RPG World</option><option value="1.2.0">1.2 — RPG Village/Castle</option><option value="1.1.0">1.1 — Variety</option><option value="1.0.0">1.0 — Legacy</option></select></label></div>
    <label>Field size <input id="fieldSize" type="range" min="26" max="56" step="1" value="34"><output id="fieldSizeOut"></output></label>
    <label>Density <input id="fieldDensity" type="range" min="0" max="1" step="0.05" value="0.55"><output id="fieldDensityOut"></output></label>
    <label>Dressing <input id="fieldDressing" type="range" min="0" max="1" step="0.05" value="0.55"><output id="fieldDressingOut"></output></label>
    <div class="sectionTitle fieldEditTitle">FIELD EDITOR</div>
    <div id="selectedAsset" class="selectedAsset">Tap an asset to select it</div>
    <div class="nudgeGrid"><span></span><button data-nudge="0,1">↑</button><span></span><button data-nudge="-1,0">←</button><button id="fieldCenterSelection">◎</button><button data-nudge="1,0">→</button><span></span><button data-nudge="0,-1">↓</button><span></span></div>
    <div class="fieldEditButtons"><button id="fieldRotateLeft">ROTATE −15°</button><button id="fieldRotateRight">ROTATE +15°</button><button id="fieldDuplicate">DUPLICATE</button><button id="fieldRegenerateAsset">REGENERATE ASSET</button><button id="fieldDeleteAsset">DELETE</button><button id="fieldClearSelection">CLEAR</button></div>
  </section>
  <section id="landscapePanel" hidden>
    <label>Feature<select id="feature"><option value="ridge">Rocky Ridge</option><option value="mesa">Terraced Mesa</option><option value="ravine">Ravine</option></select></label>
    <label>Size <input id="terrainSize" type="range" min="18" max="80" step="1" value="30"><output id="terrainSizeOut"></output></label>
    <label>Relief <input id="relief" type="range" min="1" max="24" step="0.5" value="7"><output id="reliefOut"></output></label>
    <label>Roughness <input id="roughness" type="range" min="0" max="1" step="0.05" value="0.45"><output id="roughnessOut"></output></label>
    <label>Terracing <input id="terracing" type="range" min="0" max="1" step="0.05" value="0.35"><output id="terracingOut"></output></label>
    <label>Mesh resolution <input id="gridResolution" type="range" min="24" max="128" step="8" value="56"><output id="gridResolutionOut"></output></label>
    <div class="checks"><label><input id="path" type="checkbox" checked> Carve path</label><label><input id="rocks" type="checkbox" checked> Scatter rocks</label></div>
  </section>
  <button id="generate" class="primary">GENERATE</button>
  <div class="viewbuttons"><button data-view="field">3/4 FIELD</button><button data-view="front">FRONT</button><button data-view="side">SIDE</button><button data-view="orbit">FREE ORBIT</button></div>
  <div class="sectionTitle">PROJECT</div><div class="projectRow"><select id="projectSelect"><option value="">Saved projects…</option></select><button id="loadProject">LOAD</button></div><div class="projectbuttons"><button id="saveProject">SAVE LOCAL</button><button id="deleteProject">DELETE</button></div>
  <div class="sectionTitle">RECIPE / EXPORT</div><input id="recipeFile" type="file" accept="application/json,.json" hidden><div class="exports"><button id="importRecipe">IMPORT RECIPE</button><button id="exportJSON">RECIPE JSON</button><button id="exportScene">SCENE JSON</button><button id="exportAsset">ASSET JSON</button><button id="exportGLB">GLB</button><button id="exportPNG">PNG</button></div>
  <div class="validationRow"><span>VALIDATION</span><b id="validation" data-state="good">VALID</b></div><div id="status">Ready.</div>
</aside>
<main class="viewport"><div class="hud"><span id="modeLabel">BUILDING</span><span id="seedLabel">SEED 48127</span></div><div id="canvasHost"></div><div class="hint">Drag to orbit · wheel/pinch to zoom · same recipe = same asset</div></main>
</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module" src="src/app.js"></script></body></html>
